<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDI Escavador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout (padrão portal Smart): barra lateral branca com itens em lista, cabeçalho fino com menu e avatar, conteúdo centralizado em cards brancos bem arredondados. */
:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --surface-2:#FAFAFB; --line:#ECECEE; --line-2:#F2F2F4;
  --ink:#121316; --ink-2:#4B4F57; --ink-3:#8A8F98;
  --pri:#121316; --pri-ink:#FFFFFF; --hover:#F4F4F5;
  --green:#5DB075; --green-soft:#EAF6EE; --blue:#5B7CF5; --blue-soft:#EEF1FE; --purple:#8E63D8; --purple-soft:#F3EEFC;
  --orange:#D9952B; --orange-soft:#FDF4E6; --red:#E5484D; --red-soft:#FDECEC; --gray:#9AA0A8; --gray-soft:#F1F2F4;
  --ok:var(--green); --ok-soft:var(--green-soft); --warn:var(--orange); --warn-soft:var(--orange-soft); --bad:var(--red); --bad-soft:var(--red-soft);
  --info:var(--blue); --info-soft:var(--blue-soft); --muted:#6B7079; --muted-soft:var(--gray-soft);
  --shadow:0 1px 2px rgba(17,18,22,.04);
  --font:"Lexend",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111214; --surface:#1A1B1F; --surface-2:#1F2125; --line:#2C2E33; --line-2:#25272B;
  --ink:#F2F3F5; --ink-2:#C3C6CC; --ink-3:#8E939B; --pri:#F2F3F5; --pri-ink:#111214; --hover:#24262A;
  --green-soft:#17301F; --blue-soft:#1A2242; --purple-soft:#2A1F3D; --orange-soft:#33260F; --red-soft:#3A1B1C; --gray-soft:#26282C; --muted:#A3A8B0;
  --shadow:none; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111214; --surface:#1A1B1F; --surface-2:#1F2125; --line:#2C2E33; --line-2:#25272B;
  --ink:#F2F3F5; --ink-2:#C3C6CC; --ink-3:#8E939B; --pri:#F2F3F5; --pri-ink:#111214; --hover:#24262A;
  --green-soft:#17301F; --blue-soft:#1A2242; --purple-soft:#2A1F3D; --orange-soft:#33260F; --red-soft:#3A1B1C; --gray-soft:#26282C; --muted:#A3A8B0;
  --shadow:none; color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25;font-weight:700}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- casca ---------- */
.app{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:100%}
.app.collapsed{grid-template-columns:0 minmax(0,1fr)}
.app.collapsed .side{visibility:hidden}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;min-width:0}
.brand{display:flex;align-items:center;gap:6px;padding:0 10px;height:52px;flex:none}
.brand svg{width:20px;height:24px;flex:none}
.brand b{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.brand small{font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:4px;font-weight:600}
.nav{display:flex;flex-direction:column;border-top:1px solid var(--line-2)}
.nav-label{display:none}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:0 10px;height:34px;border-bottom:1px solid var(--line-2);font-size:12px;color:var(--ink)}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--hover);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.nav .ic{width:15px;height:15px;flex:none}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:10.5px;padding:0 6px;line-height:16px;font-weight:700}
.scrim{display:none}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:52px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--surface);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));position:sticky;top:0;z-index:15}
.icon-btn{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--hover)}
.topbar .sp{flex:1}
.me{display:flex;align-items:center;gap:8px;min-width:0}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;font-weight:700;font-size:11.5px;flex:none;border:1px solid var(--line)}
.me div{min-width:0;line-height:1.2}
.me b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:var(--ink-3);font-size:11px;white-space:nowrap}
.demo{background:var(--orange-soft);color:var(--ink);padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;font-size:12px;border-bottom:1px solid var(--line)}
.demo select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-weight:600}
.demo button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-block:32px 10px}
.top h1{font-size:28px;letter-spacing:-.02em}
.top p{margin:8px 0 0;color:var(--ink-3);font-size:14.5px;max-width:42ch}
.tiles{display:flex;gap:12px;flex-wrap:wrap}
.tile{all:unset;cursor:pointer;width:156px;min-height:96px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(17,18,22,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:12.5px;text-align:center;padding:12px}
.tile:hover{border-color:var(--ink-3)}
.tile:focus-visible{outline:2px solid var(--blue)}
.ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.ico svg{width:19px;height:19px}
.ico.green{background:var(--green-soft);color:var(--green)} .ico.red{background:var(--red-soft);color:var(--red)} .ico.blue{background:var(--blue-soft);color:var(--blue)}
.ico.purple{background:var(--purple-soft);color:var(--purple)} .ico.orange{background:var(--orange-soft);color:var(--orange)} .ico.gray{background:var(--gray-soft);color:var(--muted)}
.build-row{display:flex;justify-content:flex-end}
.build{font:10.5px var(--mono);color:var(--ink-3);border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:var(--surface)}
.content{padding-block:12px 56px;display:flex;flex-direction:column;gap:18px}

/* ---------- blocos ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 2px 10px rgba(17,18,22,.035)}
.sec{padding:24px 26px;display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:16px}
.sec-h .n{width:26px;height:26px;border-radius:8px;background:var(--gray-soft);color:var(--ink-2);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.sec-h .sp{flex:1}
.sec-h p{margin:0;color:var(--ink-3);font-size:12.5px;flex-basis:100%;max-width:80ch}
.eyebrow{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:6px}
.hint{color:var(--ink-3);font-size:12px}
.empty-txt{color:var(--ink-3);font-style:italic}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri,.btn.dark{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover,.btn.dark:hover{opacity:.88;background:var(--pri)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.ok:hover{background:var(--green);opacity:.9}
.btn.bad{border-color:var(--red);color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--gray-soft);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--green-soft);color:var(--green)} .pill.warn{background:var(--orange-soft);color:var(--orange)}
.pill.bad{background:var(--red-soft);color:var(--red)} .pill.info{background:var(--purple-soft);color:var(--purple)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:1px 8px;font-size:11px;color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.tag-late{color:var(--red);font-weight:700;font-size:12px}

.bar{height:7px;border-radius:99px;background:var(--gray-soft);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.ok i{background:var(--green)}
.prog{display:flex;align-items:center;gap:8px}
.prog .bar{flex:1}
.prog span{font-size:11.5px;color:var(--ink-2);width:34px;text-align:right}

.callout{border-radius:12px;padding:12px 16px;display:flex;gap:10px;align-items:flex-start;font-size:13px;flex-wrap:wrap}
.callout b{font-weight:700}
.callout.bad{background:var(--red-soft)} .callout.warn{background:var(--orange-soft)} .callout.info{background:var(--blue-soft)} .callout.ok{background:var(--green-soft)}
.callout .sp{flex:1;min-width:200px}
.callout .row{margin-left:auto}

/* cabeçalho do PDI (formato do card "Pagamento mais recente") */
.pdi-head{padding:24px 26px;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px;align-items:end}
.pdi-head h2{font-size:17px;margin:6px 0 14px}
.pdi-head .big-title{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink-3);font-size:12px;margin-top:6px}
.meta b{font-weight:500}
.big-prog{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.big-prog .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;text-align:right}
.big-prog .v small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:4px;letter-spacing:0}
.big-prog .hint{text-align:right}
.big-prog .row{justify-content:flex-end}
.pdi-foot{grid-column:1/-1;border-top:1px solid var(--line-2);padding-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* campos */
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 20px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.dl dd{margin:3px 0 0;font-weight:600;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>*{min-width:0}
.col-h{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink-2);display:flex;gap:8px;align-items:center;margin-bottom:10px}
.col-h::before{content:"";width:22px;height:22px;border-radius:7px;background:var(--green-soft) radial-gradient(circle,var(--green) 3px,transparent 3.5px)}
.col-h.dev::before{background:var(--blue-soft) radial-gradient(circle,var(--blue) 3px,transparent 3.5px)}
.items{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px}
.item b{display:block;font-size:13.5px}
.item p{margin:3px 0 0;color:var(--ink-2);font-size:12.5px;white-space:pre-wrap}
.item .lbl{font-size:10px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.obj{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px}
.obj b{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.obj p{margin:4px 0 0;white-space:pre-wrap}

/* ações */
.acoes{display:flex;flex-direction:column;gap:12px}
.acao{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.acao.st-Pendente{border-color:color-mix(in srgb,var(--orange) 45%,var(--line))}
.acao.st-Reprovado{border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.acao-h{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 0;flex-wrap:wrap}
.acao-h h3{font-size:14.5px;flex:1;min-width:200px}
.acao-b{padding:10px 18px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 18px}
.acao-b div{min-width:0}
.acao-b .lbl{font-size:10px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.acao-b p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.acao-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--line-2);background:var(--surface-2)}
.acao-f .prog{flex:1;min-width:180px}
.acao .callout{margin:0 18px 12px}
.counts{display:flex;gap:6px;flex-wrap:wrap}

/* KPIs (formato dos cards de benefício) e tabelas */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-radius:14px;--c:var(--muted);--cs:var(--gray-soft)}
.kpi .l{font-size:10.5px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:8px;line-height:1.3}
.kpi .l::before{content:"";width:24px;height:24px;border-radius:8px;flex:none;background:var(--cs) radial-gradient(circle,var(--c) 3.5px,transparent 4px)}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin-top:6px}
.kpi .s{font-size:11.5px;color:var(--c)}
.kpi.k-brand{--c:var(--purple);--cs:var(--purple-soft)} .kpi.k-ok{--c:var(--green);--cs:var(--green-soft)} .kpi.k-warn{--c:var(--orange);--cs:var(--orange-soft)}
.kpi.k-bad{--c:var(--red);--cs:var(--red-soft)} .kpi.k-info{--c:var(--blue);--cs:var(--blue-soft)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--hover)}
td .sub{display:block;color:var(--ink-3);font-size:11.5px}
td.r,th.r{text-align:right}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;min-width:0}
.filters input{flex:1 1 200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:12px;font-weight:600;color:var(--ink-2);border-radius:7px}
.seg button.on{background:var(--pri);color:var(--pri-ink)}
.seg button:focus-visible{outline:2px solid var(--blue)}
/* rosca de status (painel RH) */
.dist{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:center}
.donut{width:200px;height:200px;border-radius:50%;position:relative;margin:0 auto}
.donut::after{content:"";position:absolute;inset:40px;border-radius:50%;background:var(--surface)}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.donut .c small{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.donut .c b{font-size:22px}
.dist-cap{text-align:center;color:var(--ink-2);font-size:12px;margin-top:10px}
.legend-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.lt .l{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);font-weight:600;display:flex;gap:8px;align-items:center;line-height:1.3}
.lt .l i{width:22px;height:22px;border-radius:7px;flex:none}
.lt b{display:block;font-size:20px;margin-top:6px}
.lt span{font-size:11.5px}

/* importar */
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:center}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop b{font-size:14px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.steps div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.steps div b{display:block;color:var(--ink);margin-bottom:2px}

/* modal e toast */
.ov{position:fixed;inset:0;background:rgba(17,18,22,.38);display:flex;align-items:flex-start;justify-content:center;padding:max(28px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));z-index:50;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:min(620px,100%);box-shadow:0 24px 60px rgba(0,0,0,.18);display:flex;flex-direction:column}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:16px;flex:1}
.modal-b{padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:14px 22px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12px;font-weight:600;color:var(--ink-2)}
.f small{color:var(--ink-3);font-size:11.5px}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;width:100%}
.f textarea{min-height:70px;resize:vertical}
.f input[type=range]{padding:0;border:0;accent-color:var(--pri)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
.fs{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin:0}
.fs legend{font-size:11px;font-weight:600;padding:0 4px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.quick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.quick button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:2px 10px;font-size:11.5px;cursor:pointer}
.quick button:hover{border-color:var(--ink-3)}
.toast{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--pri);color:var(--pri-ink);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:min(420px,calc(100vw - 36px))}
.toast.err{background:var(--red);color:#fff}
.loading{padding:40px;text-align:center;color:var(--ink-3)}
.timeline{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
.timeline li:last-child{border-bottom:0}
.timeline time{color:var(--ink-3);font-size:11.5px}
.timeline p{margin:0;color:var(--ink-2);overflow-wrap:anywhere}
details.card>summary{cursor:pointer;padding:16px 26px;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"▸";color:var(--ink-3)}
details[open].card>summary::before{content:"▾"}
details.card .inner{padding:0 26px 16px}
.empty{padding:30px 26px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.empty h2{font-size:20px}
.empty p{margin:0;color:var(--ink-2);max-width:62ch}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;width:100%}
.opt{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);align-items:flex-start}
.opt b{font-size:14.5px}
.opt p{font-size:12.5px;margin:0}

@media (max-width:900px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:240px;z-index:40;transform:translateX(-100%);transition:transform .18s;visibility:visible!important;padding-top:env(safe-area-inset-top,0px);box-shadow:0 0 40px rgba(0,0,0,.15)}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(17,18,22,.3);z-index:30}
  .main{min-width:0}
  .pdi-head,.dist{grid-template-columns:1fr}
  .big-prog .v,.big-prog .hint{text-align:left} .big-prog .row{justify-content:flex-start}
  .two,.grid2{grid-template-columns:1fr}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top h1{font-size:24px}
  .tile{width:calc(50% - 6px);min-width:0}
  .tiles{width:100%}
  .me div{display:none}
  .timeline li{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){ .side{transition:none} }
@media (prefers-reduced-motion:no-preference){ .modal{animation:pop .14s ease-out} @keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}} }
@media print{ .side,.topbar,.demo,.btn,.tiles{display:none!important} .app{display:block} }
</style>

<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><svg viewBox="0 0 20 24" aria-hidden="true"><path d="M15.5 5.2C14.3 3.4 12.3 2.5 10 2.5 6.9 2.5 4.6 4.3 4.6 6.9c0 2.4 1.9 3.6 5.4 4.6" fill="none" stroke="#F0563F" stroke-width="3" stroke-linecap="round"/><path d="M10 11.5c3.6 1 5.6 2.3 5.6 4.9 0 2.8-2.5 4.9-5.8 4.9-2.5 0-4.6-1-5.8-2.9" fill="none" stroke="#3B6FE0" stroke-width="3" stroke-linecap="round"/></svg><b>smart</b><small>PDI</small></div>
    <nav class="nav" id="nav" aria-label="Menu"></nav>
  </aside>
  <div class="scrim" data-act="tgl"></div>
  <main class="main">
    <div class="topbar"><button class="icon-btn" data-act="tgl" aria-label="Mostrar ou esconder o menu"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><span class="sp"></span><div class="me" id="meBox"></div></div>
    <div class="demo" id="demoBar" hidden></div>
    <div class="wrap">
      <header class="top"><div><h1 id="tTitle">Carregando…</h1><p id="tSub"></p></div><div class="tiles" id="tTiles"></div></header>
      <div class="build-row"><span class="build" id="build"></span></div>
      <div class="content" id="view"><div class="loading">Carregando seu PDI…</div></div>
    </div>
  </main>
</div>
<div id="modalRoot"></div>

<script>
/* ===== Regras de negócio (cópia de Logica.gs — usada só no modo demonstração) ===== */
/**
 * PDI · Escavador — regras de negócio (puras, sem dependência do Apps Script).
 * O MESMO código roda no servidor (Logica.gs) e no modo demonstração do Index.html.
 * Cada função recebe (db, emailDoUsuario, ...args). db = { usuarios, pdis, auto, acoes, hist, _dirty }.
 */
var PDI = (function () {

  var STATUS_ACAO = ['Não iniciado', 'Em andamento', 'Concluído', 'Cancelado'];
  var APROVACAO = ['Rascunho', 'Pendente', 'Aprovado', 'Reprovado'];
  var CAMPOS_NUCLEO = ['oque', 'como', 'suporte', 'inicio', 'prazo', 'indicador'];

  // ---------- utilitários ----------
  function low(s) { return String(s == null ? '' : s).trim().toLowerCase(); }
  function str(s) { return s == null ? '' : String(s).trim(); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hoje() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function agora() { var d = new Date(); return hoje() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function novoId(p) { return p + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase(); }
  function erro(msg) { throw new Error(msg); }
  function sujo(db, t) { db._dirty = db._dirty || {}; db._dirty[t] = true; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function num(x) { var n = parseFloat(x); return isNaN(n) ? 0 : n; }

  function usuario(db, email) { email = low(email); for (var i = 0; i < db.usuarios.length; i++) if (low(db.usuarios[i].email) === email) return db.usuarios[i]; return null; }
  function ativo(u) { return u && low(u.ativo) !== 'não' && low(u.ativo) !== 'nao' && low(u.ativo) !== 'false'; }
  function isRH(db, email) { var u = usuario(db, email); return !!u && low(u.perfil) === 'rh'; }
  function liderados(db, email) { email = low(email); return db.usuarios.filter(function (u) { return low(u.gestor) === email && ativo(u); }); }
  function isLider(db, email) { var u = usuario(db, email); return (!!u && low(u.perfil) === 'líder') || liderados(db, email).length > 0; }
  function pdiDe(db, email) { email = low(email); for (var i = 0; i < db.pdis.length; i++) if (low(db.pdis[i].email) === email) return db.pdis[i]; return null; }
  function pdiPorId(db, id) { for (var i = 0; i < db.pdis.length; i++) if (db.pdis[i].id === id) return db.pdis[i]; return null; }
  function acoesDe(db, pdiId) { return db.acoes.filter(function (a) { return a.pdiId === pdiId; }); }
  function acaoPorId(db, id) { for (var i = 0; i < db.acoes.length; i++) if (db.acoes[i].id === id) return db.acoes[i]; return null; }
  function nomeDe(db, email) { var u = usuario(db, email); return u ? (u.nome || u.email) : (email || ''); }

  function log(db, pdiId, acaoId, autor, evento, detalhe) {
    db.hist.push({ data: agora(), pdiId: pdiId, acaoId: acaoId || '', autor: autor, evento: evento, detalhe: detalhe || '' });
    sujo(db, 'hist');
  }

  function atrasada(a) { return !!a.prazo && a.prazo < hoje() && a.status !== 'Concluído' && a.status !== 'Cancelado'; }
  function progressoAcao(a) { return a.status === 'Concluído' ? 100 : Math.max(0, Math.min(100, num(a.progresso))); }

  // ---------- status consolidado ----------
  function resumoPDI(db, p) {
    var acs = acoesDe(db, p.id).filter(function (a) { return a.status !== 'Cancelado'; });
    var r = { total: acs.length, concluidas: 0, atrasadas: 0, pendentes: 0, reprovadas: 0, rascunho: 0, aprovadas: 0, progresso: 0 };
    var soma = 0;
    acs.forEach(function (a) {
      if (a.status === 'Concluído') r.concluidas++;
      if (atrasada(a)) r.atrasadas++;
      if (a.aprovacao === 'Pendente') r.pendentes++;
      if (a.aprovacao === 'Reprovado') r.reprovadas++;
      if (a.aprovacao === 'Rascunho') r.rascunho++;
      if (a.aprovacao === 'Aprovado') r.aprovadas++;
      soma += progressoAcao(a);
    });
    r.progresso = acs.length ? Math.round(soma / acs.length) : 0;
    if (!acs.length) r.status = 'Em elaboração';
    else if (r.concluidas === acs.length && r.aprovadas === acs.length) r.status = 'Concluído';
    else if (r.reprovadas) r.status = 'Ajustes solicitados';
    else if (r.pendentes) r.status = 'Aguardando aprovação';
    else if (r.rascunho) r.status = 'Em elaboração';
    else r.status = 'Em andamento';
    return r;
  }

  function linhaResumo(db, u) {
    var p = pdiDe(db, u.email);
    var base = { email: u.email, nome: u.nome || u.email, cargo: u.cargo || '', area: u.area || 'Sem área', gestor: u.gestor || '', gestorNome: u.gestor ? nomeDe(db, u.gestor) : '—', perfil: u.perfil || 'Colaborador' };
    if (!p) { base.temPDI = false; base.status = 'Sem PDI'; base.progresso = 0; base.total = 0; base.concluidas = 0; base.atrasadas = 0; base.pendentes = 0; base.reprovadas = 0; base.origem = ''; base.atualizadoEm = ''; base.fim = ''; return base; }
    var r = resumoPDI(db, p);
    for (var k in r) base[k] = r[k];
    base.temPDI = true; base.origem = p.origem; base.atualizadoEm = p.atualizadoEm; base.fim = p.fim; base.inicio = p.inicio;
    return base;
  }

  function pdiCompleto(db, email) {
    var p = pdiDe(db, email);
    if (!p) return null;
    var out = clone(p);
    var u = usuario(db, email) || {};
    out.gestorNome = p.gestor ? nomeDe(db, p.gestor) : '';
    out.area = u.area || '';
    out.auto = db.auto.filter(function (x) { return x.pdiId === p.id; }).sort(function (a, b) { return (a.tipo + a.ordem) < (b.tipo + b.ordem) ? -1 : 1; });
    out.acoes = acoesDe(db, p.id).map(function (a) { var c = clone(a); c.atrasada = atrasada(a); c.progresso = progressoAcao(a); c.avaliadoPorNome = a.avaliadoPor ? nomeDe(db, a.avaliadoPor) : ''; return c; });
    out.hist = db.hist.filter(function (h) { return h.pdiId === p.id; }).slice(-40).reverse().map(function (h) { var c = clone(h); c.autorNome = nomeDe(db, h.autor); return c; });
    out.resumo = resumoPDI(db, p);
    return out;
  }

  function podeVer(db, me, email) {
    if (low(me) === low(email)) return true;
    if (isRH(db, me)) return true;
    var u = usuario(db, email);
    return !!u && low(u.gestor) === low(me);
  }
  function podeEditar(db, me, email) { return low(me) === low(email) || isRH(db, me); }

  function garantirUsuario(db, me) {
    var u = usuario(db, me);
    if (!u) {
      u = { email: low(me), nome: low(me).split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); }), cargo: '', area: '', gestor: '', perfil: 'Colaborador', ativo: 'Sim' };
      db.usuarios.push(u); sujo(db, 'usuarios');
    }
    return u;
  }

  function criarPDI(db, email, autor, origem) {
    var u = usuario(db, email) || {};
    var ini = hoje(), d = new Date(); d.setFullYear(d.getFullYear() + 1);
    var p = { id: novoId('P'), email: low(email), nome: u.nome || email, cargo: u.cargo || '', gestor: low(u.gestor || ''), inicio: ini, fim: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()), curtoPrazo: '', medioPrazo: '', origem: origem || 'Ferramenta', criadoEm: agora(), atualizadoEm: agora(), enviadoEm: '' };
    db.pdis.push(p); sujo(db, 'pdis');
    log(db, p.id, '', autor, 'PDI criado', origem === 'Excel' ? 'a partir de planilha Excel' : 'na ferramenta');
    return p;
  }

  function tocar(db, p) { p.atualizadoEm = agora(); sujo(db, 'pdis'); }

  function normAcao(a) {
    var st = STATUS_ACAO.indexOf(a.status) >= 0 ? a.status : 'Não iniciado';
    return { oque: str(a.oque), como: str(a.como), suporte: str(a.suporte), inicio: str(a.inicio), prazo: str(a.prazo), prazoTexto: str(a.prazoTexto), indicador: str(a.indicador), status: st, progresso: st === 'Concluído' ? 100 : Math.max(0, Math.min(100, Math.round(num(a.progresso)))), obs: str(a.obs) };
  }

  // ================= API =================
  var api = {};

  api.contexto = function (db, me) {
    var u = garantirUsuario(db, me);
    return { me: clone(u), isRH: isRH(db, me), isLider: isLider(db, me), temPDI: !!pdiDe(db, me), liderados: liderados(db, me).length, hoje: hoje() };
  };

  api.verPDI = function (db, me, email) {
    email = email || me;
    if (!podeVer(db, me, email)) erro('Você não tem acesso a este PDI.');
    var u = usuario(db, email);
    return { pdi: pdiCompleto(db, email), pessoa: u ? clone(u) : { email: email, nome: email }, gestorNome: u && u.gestor ? nomeDe(db, u.gestor) : '' };
  };

  api.iniciarPDI = function (db, me, email) {
    email = email || me;
    if (!podeEditar(db, me, email)) erro('Somente o próprio colaborador ou o RH podem criar este PDI.');
    if (!pdiDe(db, email)) criarPDI(db, email, me, 'Ferramenta');
    return api.verPDI(db, me, email);
  };

  // Identificação + Autoavaliação + Objetivos (campos parciais são mesclados)
  api.salvarCabecalho = function (db, me, dados) {
    var email = dados.email || me;
    if (!podeEditar(db, me, email)) erro('Somente o colaborador edita o próprio PDI.');
    var p = pdiDe(db, email) || criarPDI(db, email, me, 'Ferramenta');
    ['nome', 'cargo', 'inicio', 'fim', 'curtoPrazo', 'medioPrazo'].forEach(function (k) { if (dados[k] !== undefined) p[k] = str(dados[k]); });
    if (dados.inicio && dados.fim && dados.fim < dados.inicio) erro('O fim da validade precisa ser depois da data de início.');
    if (dados.auto) {
      db.auto = db.auto.filter(function (x) { return x.pdiId !== p.id; });
      dados.auto.forEach(function (x, i) {
        if (!str(x.titulo) && !str(x.descricao)) return;
        db.auto.push({ pdiId: p.id, tipo: x.tipo === 'Área de desenvolvimento' ? 'Área de desenvolvimento' : 'Ponto forte', ordem: String(x.ordem || i + 1), titulo: str(x.titulo), descricao: str(x.descricao) });
      });
      sujo(db, 'auto');
    }
    tocar(db, p);
    log(db, p.id, '', me, 'PDI atualizado', dados.secao || '');
    return api.verPDI(db, me, email);
  };

  api.salvarAcao = function (db, me, dados) {
    var email = dados.email || me;
    if (!podeEditar(db, me, email)) erro('Somente o colaborador edita o próprio plano de ação.');
    var p = pdiDe(db, email) || criarPDI(db, email, me, 'Ferramenta');
    var n = normAcao(dados);
    if (!n.oque) erro('Informe o que você vai desenvolver.');
    if (!n.prazo) erro('Informe o prazo da ação.');
    if (n.inicio && n.prazo < n.inicio) erro('O prazo precisa ser depois da data de início.');
    var a = dados.id ? acaoPorId(db, dados.id) : null;
    if (a) {
      if (a.pdiId !== p.id) erro('Ação não pertence a este PDI.');
      var mudouNucleo = CAMPOS_NUCLEO.some(function (k) { return str(a[k]) !== n[k]; });
      for (var k in n) a[k] = n[k];
      a.atualizadoEm = agora();
      if (mudouNucleo && a.aprovacao === 'Aprovado') { a.aprovacao = 'Pendente'; log(db, p.id, a.id, me, 'Ação alterada após aprovação', a.oque + ' · voltou para aprovação do líder'); }
      else if (mudouNucleo && a.aprovacao === 'Reprovado') { a.aprovacao = 'Rascunho'; log(db, p.id, a.id, me, 'Ação ajustada', a.oque + ' · pronta para reenviar'); }
      else log(db, p.id, a.id, me, 'Ação editada', a.oque);
    } else {
      a = n; a.id = novoId('A'); a.pdiId = p.id; a.aprovacao = 'Rascunho'; a.obsLider = ''; a.avaliadoPor = ''; a.avaliadoEm = ''; a.criadoEm = agora(); a.atualizadoEm = agora();
      db.acoes.push(a);
      log(db, p.id, a.id, me, 'Ação criada', a.oque);
    }
    sujo(db, 'acoes'); tocar(db, p);
    return api.verPDI(db, me, email);
  };

  api.atualizarAndamento = function (db, me, acaoId, dados) {
    var a = acaoPorId(db, acaoId) || erro('Ação não encontrada.');
    var p = pdiPorId(db, a.pdiId);
    if (!podeEditar(db, me, p.email)) erro('Somente o colaborador atualiza o andamento.');
    var antes = a.status + ' ' + progressoAcao(a) + '%';
    if (dados.status && STATUS_ACAO.indexOf(dados.status) >= 0) a.status = dados.status;
    if (dados.progresso !== undefined) a.progresso = Math.max(0, Math.min(100, Math.round(num(dados.progresso))));
    if (a.status === 'Concluído') a.progresso = 100;
    if (dados.obs !== undefined) a.obs = str(dados.obs);
    a.atualizadoEm = agora();
    sujo(db, 'acoes'); tocar(db, p);
    log(db, p.id, a.id, me, 'Andamento atualizado', a.oque + ' · ' + antes + ' → ' + a.status + ' ' + progressoAcao(a) + '%' + (str(dados.nota) ? ' · "' + str(dados.nota) + '"' : ''));
    return api.verPDI(db, me, p.email);
  };

  api.excluirAcao = function (db, me, acaoId) {
    var a = acaoPorId(db, acaoId) || erro('Ação não encontrada.');
    var p = pdiPorId(db, a.pdiId);
    if (!podeEditar(db, me, p.email)) erro('Sem permissão.');
    if (a.aprovacao === 'Aprovado' && !isRH(db, me)) erro('Ação já aprovada pelo líder: marque como Cancelada em vez de excluir.');
    db.acoes = db.acoes.filter(function (x) { return x.id !== acaoId; });
    sujo(db, 'acoes'); tocar(db, p);
    log(db, p.id, '', me, 'Ação excluída', a.oque);
    return api.verPDI(db, me, p.email);
  };

  api.enviarAprovacao = function (db, me, email) {
    email = email || me;
    if (!podeEditar(db, me, email)) erro('Sem permissão.');
    var p = pdiDe(db, email) || erro('PDI não encontrado.');
    var u = usuario(db, email) || {};
    if (!u.gestor) erro('Seu cadastro não tem gestor imediato. Peça ao RH para incluir antes de enviar.');
    p.gestor = low(u.gestor);
    var n = 0;
    acoesDe(db, p.id).forEach(function (a) { if (a.aprovacao === 'Rascunho') { a.aprovacao = 'Pendente'; a.atualizadoEm = agora(); n++; } });
    if (!n) erro('Não há ações em rascunho para enviar.');
    p.enviadoEm = agora();
    sujo(db, 'acoes'); tocar(db, p);
    log(db, p.id, '', me, 'Enviado para aprovação', n + (n > 1 ? ' ações' : ' ação') + ' para ' + nomeDe(db, u.gestor));
    return api.verPDI(db, me, email);
  };

  // ---------- Líder ----------
  api.meuTime = function (db, me) {
    return liderados(db, me).map(function (u) { return linhaResumo(db, u); }).sort(function (a, b) { return b.pendentes - a.pendentes || a.nome.localeCompare(b.nome); });
  };

  api.avaliarAcao = function (db, me, acaoId, decisao, obs) {
    var a = acaoPorId(db, acaoId) || erro('Ação não encontrada.');
    var p = pdiPorId(db, a.pdiId);
    var u = usuario(db, p.email) || {};
    if (low(u.gestor) !== low(me)) erro('Somente o gestor imediato aprova ou reprova as ações.');
    if (a.aprovacao !== 'Pendente') erro('Esta ação não está aguardando aprovação.');
    if (decisao !== 'Aprovado' && decisao !== 'Reprovado') erro('Decisão inválida.');
    if (decisao === 'Reprovado' && !str(obs)) erro('Ao reprovar, descreva o que precisa ter neste plano de ação.');
    a.aprovacao = decisao; a.obsLider = str(obs); a.avaliadoPor = low(me); a.avaliadoEm = agora(); a.atualizadoEm = agora();
    sujo(db, 'acoes'); tocar(db, p);
    log(db, p.id, a.id, me, decisao === 'Aprovado' ? 'Ação aprovada' : 'Ação reprovada', a.oque + (str(obs) ? ' · "' + str(obs) + '"' : ''));
    return api.verPDI(db, me, p.email);
  };

  // ---------- RH ----------
  function exigirRH(db, me) { if (!isRH(db, me)) erro('Área exclusiva do RH.'); }

  api.painelRH = function (db, me) {
    exigirRH(db, me);
    var linhas = db.usuarios.filter(ativo).map(function (u) { return linhaResumo(db, u); });
    var k = { colaboradores: linhas.length, comPDI: 0, semPDI: 0, concluidos: 0, aguardando: 0, ajustes: 0, acoes: 0, acoesConcluidas: 0, atrasadas: 0, excel: 0, ferramenta: 0, progressoMedio: 0 };
    var porStatus = {}, porArea = {}, soma = 0;
    linhas.forEach(function (l) {
      porStatus[l.status] = (porStatus[l.status] || 0) + 1;
      var ar = porArea[l.area] || (porArea[l.area] = { area: l.area, colaboradores: 0, comPDI: 0, concluidos: 0, somaProg: 0, atrasadas: 0 });
      ar.colaboradores++;
      if (l.temPDI) {
        k.comPDI++; ar.comPDI++; soma += l.progresso; ar.somaProg += l.progresso; ar.atrasadas += l.atrasadas;
        if (l.origem === 'Excel') k.excel++; else k.ferramenta++;
      } else k.semPDI++;
      if (l.status === 'Concluído') { k.concluidos++; ar.concluidos++; }
      if (l.status === 'Aguardando aprovação') k.aguardando++;
      if (l.status === 'Ajustes solicitados') k.ajustes++;
      k.acoes += l.total; k.acoesConcluidas += l.concluidas; k.atrasadas += l.atrasadas;
    });
    k.progressoMedio = k.comPDI ? Math.round(soma / k.comPDI) : 0;
    var areas = Object.keys(porArea).map(function (a) { var x = porArea[a]; x.progressoMedio = x.comPDI ? Math.round(x.somaProg / x.comPDI) : 0; delete x.somaProg; return x; }).sort(function (a, b) { return a.area.localeCompare(b.area); });
    return { kpis: k, porStatus: porStatus, areas: areas, linhas: linhas.sort(function (a, b) { return a.nome.localeCompare(b.nome); }), geradoEm: agora() };
  };

  api.colaboradores = function (db, me) {
    exigirRH(db, me);
    return db.usuarios.map(function (u) { var c = clone(u); c.gestorNome = u.gestor ? nomeDe(db, u.gestor) : ''; c.temPDI = !!pdiDe(db, u.email); return c; }).sort(function (a, b) { return String(a.nome).localeCompare(String(b.nome)); });
  };

  // lista leve (nome/e-mail) para seletores — RH vê todos
  api.listaPessoas = function (db, me) {
    exigirRH(db, me);
    return db.usuarios.filter(ativo).map(function (u) { return { email: u.email, nome: u.nome, cargo: u.cargo, temPDI: !!pdiDe(db, u.email) }; }).sort(function (a, b) { return String(a.nome).localeCompare(String(b.nome)); });
  };

  function upsertUsuario(db, d) {
    var email = low(d.email);
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) erro('E-mail inválido: ' + (d.email || '(vazio)'));
    var perfil = /^rh$/i.test(str(d.perfil)) ? 'RH' : (/^l[ií]der/i.test(str(d.perfil)) ? 'Líder' : 'Colaborador');
    var u = usuario(db, email), novo = !u;
    if (!u) { u = { email: email }; db.usuarios.push(u); }
    u.nome = str(d.nome) || u.nome || email; u.cargo = str(d.cargo); u.area = str(d.area); u.gestor = low(d.gestor); u.perfil = perfil;
    u.ativo = (d.ativo === false || /^n[ãa]o$/i.test(str(d.ativo))) ? 'Não' : 'Sim';
    if (u.gestor === email) erro(u.nome + ': o gestor não pode ser a própria pessoa.');
    var p = pdiDe(db, email); if (p) { p.gestor = u.gestor; if (!p.cargo) p.cargo = u.cargo; sujo(db, 'pdis'); }
    sujo(db, 'usuarios');
    return novo;
  }

  api.salvarColaborador = function (db, me, d) {
    exigirRH(db, me);
    if (d.emailOriginal && low(d.emailOriginal) !== low(d.email)) erro('Para trocar o e-mail, cadastre a pessoa de novo e desative o cadastro antigo.');
    upsertUsuario(db, d);
    return api.colaboradores(db, me);
  };

  api.importarColaboradores = function (db, me, lista) {
    exigirRH(db, me);
    var novos = 0, atualizados = 0, erros = [];
    (lista || []).forEach(function (d, i) {
      try { if (upsertUsuario(db, d)) novos++; else atualizados++; }
      catch (e) { erros.push('Linha ' + (i + 2) + ': ' + e.message); }
    });
    return { novos: novos, atualizados: atualizados, erros: erros, lista: api.colaboradores(db, me) };
  };

  // ---------- Importação de Excel (modelo PDI.xlsx) ----------
  // payload: { email, ident:{nome,cargo,inicio,fim}, auto:[], curtoPrazo, medioPrazo, acoes:[], modo:'substituir'|'adicionar', enviar:bool }
  api.importarExcel = function (db, me, d) {
    var email = low(d.email || me);
    if (!podeEditar(db, me, email)) erro('Você só pode importar o seu próprio PDI.');
    if (!usuario(db, email)) erro('Colaborador não cadastrado: ' + email);
    var p = pdiDe(db, email);
    if (!p) p = criarPDI(db, email, me, 'Excel');
    else {
      p.origem = 'Excel';
      if (d.modo === 'substituir') {
        var aprovadas = acoesDe(db, p.id).filter(function (a) { return a.aprovacao === 'Aprovado'; }).length;
        if (aprovadas && !d.confirmarAprovadas) erro('Este PDI tem ' + aprovadas + ' ação(ões) já aprovadas pelo líder. Confirme a substituição para continuar.');
        db.acoes = db.acoes.filter(function (a) { return a.pdiId !== p.id; });
      }
    }
    var id = d.ident || {};
    ['nome', 'cargo', 'inicio', 'fim'].forEach(function (k) { if (str(id[k])) p[k] = str(id[k]); });
    if (str(d.curtoPrazo)) p.curtoPrazo = str(d.curtoPrazo);
    if (str(d.medioPrazo)) p.medioPrazo = str(d.medioPrazo);
    if (d.auto && d.auto.length) {
      db.auto = db.auto.filter(function (x) { return x.pdiId !== p.id; });
      d.auto.forEach(function (x, i) { if (str(x.titulo) || str(x.descricao)) db.auto.push({ pdiId: p.id, tipo: x.tipo, ordem: String(x.ordem || i + 1), titulo: str(x.titulo), descricao: str(x.descricao) }); });
      sujo(db, 'auto');
    }
    var u = usuario(db, email); p.gestor = low(u.gestor || '');
    var envia = !!d.enviar && !!u.gestor, n = 0;
    (d.acoes || []).forEach(function (x) {
      var a = normAcao(x); if (!a.oque) return;
      a.id = novoId('A'); a.pdiId = p.id; a.aprovacao = envia ? 'Pendente' : 'Rascunho'; a.obsLider = ''; a.avaliadoPor = ''; a.avaliadoEm = ''; a.criadoEm = agora(); a.atualizadoEm = agora();
      db.acoes.push(a); n++;
    });
    if (envia && n) p.enviadoEm = agora();
    sujo(db, 'acoes'); tocar(db, p);
    log(db, p.id, '', me, 'Excel importado', n + ' ação(ões) · modo ' + (d.modo || 'substituir') + (envia ? ' · enviado para aprovação' : '') + (d.arquivo ? ' · ' + d.arquivo : ''));
    return api.verPDI(db, me, email);
  };

  api._status = { acao: STATUS_ACAO, aprovacao: APROVACAO };
  return api;
})();

</script>

/* ---------------- utilidades ---------------- */
function $(s,r){return (r||document).querySelector(s);}

function fmtDH(s){ if(!s) return '—'; var m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})\s*(\d{2}:\d{2})?/); return m? m[3]+'/'+m[2]+'/'+m[1]+(m[4]?' '+m[4]:'') : esc(s); }

  $('#ov').addEventListener('mousedown',function(e){ if(e.target.id==='ov') closeModal(); });

  var back = !dono ? '<div><button class="btn ghost sm" data-act="go" data-v="'+(lider?'time':'rh')+'">← Voltar para '+(lider?'Meu time':'Painel RH')+'</button></div>' : '';

      '<div class="opt"><span class="ico green">'+SVG.plus+'</span><b>Montar aqui na ferramenta</b><p class="hint">Preencha identificação, autoavaliação, objetivos e plano de ação passo a passo.</p><button class="btn pri" data-act="iniciar">Começar meu PDI</button></div>'+
      '<div class="opt"><span class="ico red">'+SVG.up+'</span><b>Subir o Excel preenchido</b><p class="hint">Já preencheu o modelo PDI.xlsx? Importe e revise antes de enviar ao líder.</p><div class="row"><button class="btn dark" data-act="go" data-v="importar">Importar Excel</button><button class="btn" data-act="modeloBranco">Baixar modelo</button></div></div></div></section>');
    return setView(back+'<section class="card empty"><span class="pill">Sem PDI</span><h2>'+esc(pes.nome||pes.email)+' ainda não iniciou o PDI</h2><p>Assim que o colaborador montar o plano na ferramenta ou subir o Excel, ele aparece aqui.</p></section>');
  }
  var R=p.resumo, h=back;
  // cabeçalho
  h+='<section class="card pdi-head"><div><div class="eyebrow">'+SVG.doc+'Plano de desenvolvimento individual</div><h2>'+esc(p.nome)+'</h2>'+
     '<div class="eyebrow" style="color:var(--ink-3)">Vigência</div><div class="big-title num">'+fmtD(p.inicio)+' – '+fmtD(p.fim)+'</div>'+
     '<div class="meta"><span>'+SVG.cal+' Atualizado em '+fmtDH(p.atualizadoEm)+'</span><span><b>Cargo:</b> '+esc(p.cargo||'—')+'</span><span><b>Gestor:</b> '+esc(p.gestorNome||'sem gestor')+'</span></div></div>'+
     '<div class="big-prog"><div class="row"><button class="btn pri sm" data-act="exportar">'+SVG.doc+' Baixar Excel</button></div><div class="v num">'+R.progresso+'%<small>concluído</small></div><div class="bar'+(R.progresso===100?' ok':'')+'"><i style="width:'+R.progresso+'%"></i></div><div class="hint num">'+R.concluidas+' de '+R.total+' ações concluídas'+(R.atrasadas?' · <span class="tag-late">'+R.atrasadas+' atrasada'+(R.atrasadas>1?'s':'')+'</span>':'')+'</div></div>'+
     '<div class="pdi-foot">'+pillPDI(R.status)+'<span class="chip">'+(p.origem==='Excel'?'Importado do Excel':'Montado na ferramenta')+'</span></div></section>';
  // avisos
  if(dono && R.reprovadas) h+='<div class="callout bad"><div class="sp"><b>'+esc(primeiro(p.gestorNome)||'Seu líder')+' pediu ajustes em '+R.reprovadas+' ação'+(R.reprovadas>1?'ões':'')+'.</b> Veja as observações em cada plano marcado como reprovado, ajuste e envie novamente.</div></div>';
  if(dono && R.rascunho) h+='<div class="callout info"><div class="sp"><b>'+R.rascunho+' ação'+(R.rascunho>1?'ões':'')+' em rascunho.</b> Quando estiver pronto, envie para '+esc(p.gestorNome||'seu gestor')+' aprovar.</div><div class="row"><button class="btn pri sm" data-act="enviar">Enviar para aprovação</button></div></div>';
  if(dono && R.pendentes && !R.rascunho) h+='<div class="callout warn"><div class="sp"><b>'+R.pendentes+' ação'+(R.pendentes>1?'ões':'')+' aguardando '+esc(p.gestorNome||'o gestor')+'.</b> Você pode seguir editando o restante do PDI.</div></div>';
  if(lider && R.pendentes) h+='<div class="callout warn"><div class="sp"><b>'+R.pendentes+' ação'+(R.pendentes>1?'ões':'')+' aguardando sua aprovação.</b> Aprove ou reprove cada plano; ao reprovar, diga o que precisa ter.</div></div>';
  // 1 identificação
  h+='<section class="card sec"><div class="sec-h"><span class="n">1</span><h2>Identificação</h2><span class="sp"></span>'+(dono?'<button class="btn sm" data-act="edIdent">Editar</button>':'')+'</div>'+
     '<dl class="dl"><div><dt>Nome do colaborador</dt><dd>'+esc(p.nome)+'</dd></div><div><dt>Cargo</dt><dd>'+esc(p.cargo||'—')+'</dd></div><div><dt>Gestor imediato</dt><dd>'+esc(p.gestorNome||'—')+'</dd></div><div><dt>Data de início do PDI</dt><dd class="num">'+fmtD(p.inicio)+'</dd></div><div><dt>Período de validade</dt><dd class="num">até '+fmtD(p.fim)+'</dd></div></dl></section>';
  // 2 autoavaliação
  var pf=p.auto.filter(function(x){return x.tipo==='Ponto forte';}), ad=p.auto.filter(function(x){return x.tipo!=='Ponto forte';});
  function lista(arr,lbl,vazio){ if(!arr.length) return '<p class="empty-txt">'+vazio+'</p>'; return '<div class="items">'+arr.map(function(x){ return '<div class="item"><b>'+esc(x.titulo||'—')+'</b>'+(x.descricao?'<span class="lbl">'+lbl+'</span><p>'+esc(x.descricao)+'</p>':'')+'</div>'; }).join('')+'</div>'; }
  h+='<section class="card sec"><div class="sec-h"><span class="n">2</span><h2>Autoavaliação</h2><span class="sp"></span>'+(dono?'<button class="btn sm" data-act="edAuto">Editar</button>':'')+'<p>Competências atuais com base na avaliação 360º, feedbacks recebidos e autopercepção.</p></div>'+
     '<div class="two"><div><div class="col-h">Pontos fortes</div>'+lista(pf,'Como se manifesta','Nenhum ponto forte registrado.')+'</div><div><div class="col-h dev">Áreas de desenvolvimento</div>'+lista(ad,'Por que é importante','Nenhuma área de desenvolvimento registrada.')+'</div></div></section>';
  // 3 objetivos
  h+='<section class="card sec"><div class="sec-h"><span class="n">3</span><h2>Objetivo de carreira</h2><span class="sp"></span>'+(dono?'<button class="btn sm" data-act="edObj">Editar</button>':'')+'<p>Como o desenvolvimento das áreas acima contribui para os objetivos de curto e médio prazo.</p></div>'+
     '<div class="two"><div class="obj"><b>Curto prazo · 6 meses a 1 ano</b><p>'+(p.curtoPrazo?esc(p.curtoPrazo):'<span class="empty-txt">Não preenchido.</span>')+'</p></div><div class="obj"><b>Médio prazo · 2 a 3 anos</b><p>'+(p.medioPrazo?esc(p.medioPrazo):'<span class="empty-txt">Não preenchido.</span>')+'</p></div></div></section>';
  // 4 plano de ação
  var cnt='<div class="counts">'+(R.aprovadas?pill(R.aprovadas+' aprovada'+(R.aprovadas>1?'s':''),'ok'):'')+(R.pendentes?pill(R.pendentes+' aguardando','warn'):'')+(R.reprovadas?pill(R.reprovadas+' reprovada'+(R.reprovadas>1?'s':''),'bad'):'')+(R.rascunho?pill(R.rascunho+' rascunho'):'')+'</div>';
  h+='<section class="card sec"><div class="sec-h"><span class="n">4</span><h2>Plano de ação</h2>'+cnt+'<span class="sp"></span>'+(dono?(R.rascunho?'<button class="btn sm dark" data-act="enviar">Enviar '+R.rascunho+' para aprovação</button>':'')+'<button class="btn pri sm" data-act="novaAcao">+ Nova ação</button>':'')+'</div>';
  if(!p.acoes.length) h+='<p class="empty-txt">Nenhuma ação cadastrada'+(dono?'. Comece por uma das áreas de desenvolvimento da autoavaliação.':'.')+'</p>';
  else h+='<div class="acoes">'+p.acoes.map(acaoHTML).join('')+'</div>';
  h+='</section>';
  // histórico
  h+='<details class="card"><summary>Histórico do PDI <span class="hint num">('+p.hist.length+')</span></summary><div class="inner"><ul class="timeline">'+p.hist.map(function(x){ return '<li><time class="num">'+fmtDH(x.data)+'</time><p><b>'+esc(x.evento)+'</b> · '+esc(x.autorNome)+(x.detalhe?'<br>'+esc(x.detalhe):'')+'</p></li>'; }).join('')+'</ul></div></details>';
  setView(h);
}

function acaoHTML(a){
  var dono=S.modo==='dono', lider=S.modo==='lider', d=diasAte(a.prazo);
  var prazoTxt = a.status==='Concluído'?'Concluída':(a.status==='Cancelado'?'Cancelada':(a.atrasada?'<span class="tag-late">'+Math.abs(d)+' dia'+(Math.abs(d)!==1?'s':'')+' de atraso</span>':(d!=null?(d===0?'vence hoje':'faltam '+d+' dia'+(d!==1?'s':'')):'')));
  var h='<article class="acao st-'+esc(a.aprovacao)+'"><div class="acao-h"><h3>'+esc(a.oque)+'</h3><div class="row">'+pill(APR_TXT[a.aprovacao]||a.aprovacao, ST_APR[a.aprovacao])+pill(a.status, ST_ACAO[a.status])+'</div></div>';
  h+='<div class="acao-b">'+
     '<div><span class="lbl">Como? (ações e recursos)</span><p>'+(esc(a.como)||'—')+'</p></div>'+
     '<div><span class="lbl">Suporte do gestor</span><p>'+(esc(a.suporte)||'—')+'</p></div>'+
     '<div><span class="lbl">Indicador de sucesso</span><p>'+(esc(a.indicador)||'—')+'</p></div>'+
     '<div><span class="lbl">Início → prazo</span><p class="num">'+fmtD(a.inicio)+' → '+fmtD(a.prazo)+(a.prazoTexto?' <span class="hint">('+esc(a.prazoTexto)+')</span>':'')+'<br><span class="hint">'+prazoTxt+'</span></p></div>'+
     (a.obs?'<div style="grid-column:1/-1"><span class="lbl">Observações</span><p>'+esc(a.obs)+'</p></div>':'')+'</div>';
  if(a.aprovacao==='Reprovado' && a.obsLider) h+='<div class="callout bad"><div class="sp"><b>'+esc(primeiro(a.avaliadoPorNome)||'Líder')+' pediu ajustes</b> <span class="hint num">· '+fmtDH(a.avaliadoEm)+'</span><br><span style="white-space:pre-wrap">'+esc(a.obsLider)+'</span></div></div>';
  else if(a.aprovacao==='Aprovado' && a.obsLider) h+='<div class="callout ok"><div class="sp"><b>Comentário de '+esc(primeiro(a.avaliadoPorNome))+':</b> '+esc(a.obsLider)+'</div></div>';
  h+='<div class="acao-f">'+progHTML(a.progresso, a.status==='Concluído');
  if(dono){
    h+='<button class="btn sm pri" data-act="andamento" data-id="'+a.id+'">Atualizar andamento</button><button class="btn sm" data-act="edAcao" data-id="'+a.id+'">'+(a.aprovacao==='Reprovado'?'Ajustar plano':'Editar')+'</button>';
    if(a.aprovacao!=='Aprovado') h+='<button class="btn sm ghost" data-act="delAcao" data-id="'+a.id+'">Excluir</button>';
  }
  if(lider && a.aprovacao==='Pendente') h+='<button class="btn sm ok" data-act="aprovar" data-id="'+a.id+'">Aprovar</button><button class="btn sm bad" data-act="reprovar" data-id="'+a.id+'">Reprovar</button>';
  if(a.aprovacao==='Aprovado' && a.avaliadoEm) h+='<span class="hint">Aprovada por '+esc(primeiro(a.avaliadoPorNome))+' em '+fmtD(a.avaliadoEm)+'</span>';
  h+='</div></article>';
  return h;
}
function acaoById(id){ return S.pdiRes.pdi.acoes.filter(function(a){return a.id===id;})[0]; }

function fInput(name,label,val,type,extra){ return '<div class="f"><label for="f_'+name+'">'+esc(label)+'</label><input id="f_'+name+'" name="'+name+'" type="'+(type||'text')+'" value="'+esc(val||'')+'" '+(extra||'')+'></div>'; }
function fText(name,label,val,ph,extra){ return '<div class="f"><label for="f_'+name+'">'+esc(label)+'</label><textarea id="f_'+name+'" name="'+name+'" placeholder="'+esc(ph||'')+'" '+(extra||'')+'>'+esc(val||'')+'</textarea></div>'; }
function fSel(name,label,val,opts){ return '<div class="f"><label for="f_'+name+'">'+esc(label)+'</label><select id="f_'+name+'" name="'+name+'">'+opts.map(function(o){ var v=typeof o==='string'?o:o[0], t=typeof o==='string'?o:o[1]; return '<option value="'+esc(v)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(t)+'</option>'; }).join('')+'</select></div>'; }

ACT.edObj=function(){ var p=S.pdiRes.pdi;
  modal('Objetivo de carreira','<p class="hint">Quais são seus objetivos de carreira? Como o desenvolvimento das áreas identificadas contribui para alcançá-los?</p>'+fText('curtoPrazo','Curto prazo (6 meses a 1 ano)',p.curtoPrazo,'Ex: Assumir a condução das reuniões de planejamento da squad')+fText('medioPrazo','Médio prazo (2 a 3 anos)',p.medioPrazo,'Ex: Chegar a Sênior e ser referência técnica do time'),

};
function formAcao(a){
  a=a||{inicio:hojeISO(),status:'Não iniciado',progresso:0};
  var aviso = a.aprovacao==='Aprovado'?'<div class="callout warn"><div class="sp">Esta ação já foi aprovada. Se mudar o conteúdo (o que, como, suporte, datas ou indicador), ela volta para aprovação do líder.</div></div>':(a.aprovacao==='Reprovado'&&a.obsLider?'<div class="callout bad"><div class="sp"><b>O líder pediu:</b> '+esc(a.obsLider)+'</div></div>':'');
  var areas=((S.pdiRes&&S.pdiRes.pdi&&S.pdiRes.pdi.auto)||[]).filter(function(x){return x.tipo!=='Ponto forte'&&x.titulo;});
  return aviso+fInput('oque','O que desenvolver? (competência/habilidade)',a.oque,'text','required placeholder="Ex: Comunicação assertiva"')+
    (areas.length&&!a.id?'<div class="quick"><span class="hint">Das suas áreas de desenvolvimento:</span>'+areas.map(function(x){return '<button type="button" data-oque="'+esc(x.titulo)+'">'+esc(x.titulo)+'</button>';}).join('')+'</div>':'')+
    fText('como','Como? (ações e recursos)',a.como,'Ex: Curso online, leitura de livro, praticar em reuniões')+
    fText('suporte','Suporte do gestor',a.suporte,'Ex: Reuniões semanais, indicação de materiais')+
    '<div class="grid2">'+fInput('inicio','Data de início',a.inicio,'date')+fInput('prazo','Prazo',a.prazo,'date','required')+'</div>'+
    '<div class="quick"><span class="hint">Prazo a partir do início:</span><button type="button" data-m="1">1 mês</button><button type="button" data-m="3">3 meses</button><button type="button" data-m="6">6 meses</button><button type="button" data-m="12">12 meses</button></div>'+
    fText('indicador','Indicador de sucesso',a.indicador,'Ex: Feedback positivo, maior participação')+
    '<div class="grid2">'+fSel('status','Status',a.status,PDI._status.acao)+'<div class="f"><label for="f_progresso">Progresso: <span id="pv" class="num">'+(a.progresso||0)+'%</span></label><input id="f_progresso" name="progresso" type="range" min="0" max="100" step="5" value="'+(a.progresso||0)+'"></div></div>'+
    fText('obs','Observações',a.obs,'');
}
function wireAcao(f){
  f.querySelectorAll('[data-m]').forEach(function(b){ b.onclick=function(){ f.prazo.value=addMeses(f.inicio.value,+b.dataset.m); }; });
  f.querySelectorAll('[data-oque]').forEach(function(b){ b.onclick=function(){ f.oque.value=b.dataset.oque; f.como.focus(); }; });
  var r=f.progresso; if(r){ r.oninput=function(){ $('#pv').textContent=r.value+'%'; }; }
  if(f.status) f.status.onchange=function(){ if(f.status.value==='Concluído'){ r.value=100; $('#pv').textContent='100%'; } };
}
function dadosAcao(fd,id){ return {id:id||'',oque:fd.get('oque'),como:fd.get('como'),suporte:fd.get('suporte'),inicio:fd.get('inicio'),prazo:fd.get('prazo'),indicador:fd.get('indicador'),status:fd.get('status'),progresso:fd.get('progresso'),obs:fd.get('obs')}; }
ACT.novaAcao=function(){ if(!S.pdiRes||!S.pdiRes.pdi){ return run('iniciarPDI').then(function(r){ afterSave(r); ACT.novaAcao(); }).catch(function(e){toast(errMsg(e),true);}); } modal('Nova ação do plano', formAcao(), {ok:'Salvar como rascunho',onOk:function(fd){ return run('salvarAcao',dadosAcao(fd)).then(function(r){afterSave(r,'Ação salva como rascunho. Envie para aprovação quando estiver pronto.');}); }, after:wireAcao}); };

  {ok:'Salvar andamento',onOk:function(fd){ return run('atualizarAndamento',a.id,{status:fd.get('status'),progresso:fd.get('progresso'),nota:fd.get('nota'),obs:fd.get('obs')}).then(function(r){afterSave(r,'Andamento atualizado.');}); }, after:wireAcao});

ACT.reprovar=function(el){ var a=acaoById(el.dataset.id);

function lerLista(file){
  ensureXLSX().then(function(){ return file.arrayBuffer(); }).then(function(buf){
    var wb=XLSX.read(buf,{type:'array'}), rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    var hi=rows.findIndex(function(r){ return r.some(function(c){return /e-?mail/.test(norm(c));}); }); if(hi<0) throw new Error('Não achei a coluna E-mail. Use o modelo da lista.');
    var H=rows[hi].map(norm), col=function(re){ return H.findIndex(function(h){return re.test(h);}); };
    var c={nome:col(/^nome/),email:col(/e-?mail/),cargo:col(/cargo/),area:col(/area|time/),gestor:col(/gestor|lider/),perfil:col(/perfil/),ativo:col(/ativo|situa/)};
    var lista=rows.slice(hi+1).filter(function(r){return String(r[c.email]||'').trim();}).map(function(r){ var o={}; for(var k in c) o[k]=c[k]>=0?String(r[c[k]]||'').trim():''; if(!o.ativo) o.ativo='Sim'; return o; });

/* ---------- leitura do modelo PDI.xlsx ---------- */
function cellISO(v){
  if(v==null||v==='') return '';
  if(v instanceof Date){ return isoLocal(new Date(v.getTime()+12*3600000)); }
  if(typeof v==='number' && v>20000 && v<80000){ var o=XLSX.SSF.parse_date_code(v); return o.y+'-'+pad(o.m)+'-'+pad(o.d); }
  var s=String(v).trim(), m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if(m){ var y=+m[3]; if(y<100) y+=2000; return y+'-'+pad(+m[2])+'-'+pad(+m[1]); }
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  return '';
}
function somaPeriodo(base,txt){
  var m=norm(txt).match(/(\d+)\s*(dia|semana|mes|meses|ano)/); if(!m) return '';
  var d=new Date((base||hojeISO())+'T12:00:00'), n=+m[1];
  if(m[2]==='dia') d.setDate(d.getDate()+n); else if(m[2]==='semana') d.setDate(d.getDate()+7*n); else if(m[2]==='ano') d.setFullYear(d.getFullYear()+n); else d.setMonth(d.getMonth()+n);
  return isoLocal(d);
}
function txt(v){ if(v==null) return ''; if(v instanceof Date) return fmtD(cellISO(v)); var s=String(v).trim(); return /^ex\s*:/i.test(s)?'':s; }
function mapStatus(v){ var s=norm(v); if(/nao\s*inici/.test(s)) return 'Não iniciado'; if(/conclu|finaliz/.test(s)) return 'Concluído'; if(/cancel/.test(s)) return 'Cancelado'; if(/andamento|iniciad|fazendo|curso/.test(s)) return 'Em andamento'; return 'Não iniciado'; }
function parsePDIWorkbook(wb){
  var aba=function(k){ var n=wb.SheetNames.filter(function(s){return norm(s).indexOf(k)>=0;})[0]; return n?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}):null; };
  var out={ident:{},auto:[],curtoPrazo:'',medioPrazo:'',acoes:[],avisos:[]};
  var I=aba('identifica'), A=aba('autoavalia'), O=aba('objetivo'), P=aba('plano');
  if(!I&&!A&&!O&&!P) throw new Error('Este arquivo não segue o modelo de PDI (não encontrei as abas Identificação, Autoavaliação, Objetivo de Carreira e Plano de Ação).');
  (I||[]).forEach(function(r){ var l=norm(r[0]), v=r[1];
    if(/^nome/.test(l)) out.ident.nome=txt(v); else if(/^cargo/.test(l)) out.ident.cargo=txt(v); else if(/gestor/.test(l)) out.ident.gestorTexto=txt(v);
    else if(/data de inicio/.test(l)) out.ident.inicio=cellISO(v); else if(/validade/.test(l)){ out.ident.fim=cellISO(v); if(!out.ident.fim && v){ out.ident.fimTexto=String(v); out.ident.fim=''; out.ident._fimTxt=String(v); } } });
  if(!out.ident.inicio) out.ident.inicio='';
  if(out.ident._fimTxt){ out.ident.fim=somaPeriodo(out.ident.inicio||hojeISO(),out.ident._fimTxt); if(!out.ident.fim) out.avisos.push('Período de validade "'+out.ident._fimTxt+'" não reconhecido: ajuste depois em Identificação.'); delete out.ident._fimTxt; }
  if(!out.ident.nome) out.avisos.push('Nome do colaborador vazio na aba Identificação.');
  var cur=null;
  (A||[]).forEach(function(r){ var l=norm(r[0]), v=txt(r[1])||txt(r[2]), m;
    if((m=l.match(/^ponto forte\s*(\d+)/))){ cur={tipo:'Ponto forte',ordem:+m[1],titulo:v,descricao:''}; out.auto.push(cur); }
    else if((m=l.match(/^area de desenvolvimento\s*(\d+)/))){ cur={tipo:'Área de desenvolvimento',ordem:+m[1],titulo:v,descricao:''}; out.auto.push(cur); }
    else if(cur && /como se manifesta|por que e importante/.test(l)) cur.descricao=v; });
  out.auto=out.auto.filter(function(x){return x.titulo||x.descricao;});
  (O||[]).forEach(function(r){ var l=norm(r[0]); if(/curto/.test(l)) out.curtoPrazo=txt(r[1]); else if(/medio/.test(l)) out.medioPrazo=txt(r[1]); });
  if(P){
    var hi=P.findIndex(function(r){ return r&&norm(r[0]).indexOf('o que')===0; }); if(hi<0) hi=0;
    var H=(P[hi]||[]).map(norm), ci=function(re,def){ var i=H.findIndex(function(h){return re.test(h);}); return i<0?def:i; };
    var c={oque:ci(/^o que/,0),como:ci(/^como/,1),suporte:ci(/suporte/,2),inicio:ci(/inicio/,3),prazo:ci(/^prazo/,4),indicador:ci(/indicador/,5),status:ci(/status/,6),obs:ci(/observa/,7)};
    P.slice(hi+1).forEach(function(r,i){ if(!r) return; var oque=txt(r[c.oque]); if(!oque) return;
      var ini=cellISO(r[c.inicio]), pr=cellISO(r[c.prazo]), prT='';
      if(!ini && r[c.inicio]) out.avisos.push('Linha '+(hi+i+2)+': data de início "'+r[c.inicio]+'" não é uma data; usei hoje.');
      if(!ini) ini=hojeISO();
      if(!pr && r[c.prazo]!=null && r[c.prazo]!==''){ prT=String(r[c.prazo]); pr=somaPeriodo(ini,prT); if(!pr) out.avisos.push('Linha '+(hi+i+2)+': prazo "'+prT+'" não reconhecido.'); }
      var st=mapStatus(r[c.status]);
      out.acoes.push({oque:oque,como:txt(r[c.como]),suporte:txt(r[c.suporte]),inicio:ini,prazo:pr,prazoTexto:prT,indicador:txt(r[c.indicador]),status:st,progresso:st==='Concluído'?100:0,obs:txt(r[c.obs])});
    });
  }
  if(!out.acoes.length) out.avisos.push('Nenhuma ação encontrada na aba 4. Plano de Ação (linhas iniciadas por "Ex:" são ignoradas).');
  return out;
}

function renderDemoBar(){
  var db=demoDb(), me=demoMe();
  var papel=function(u){ return low(u.perfil)==='rh'?'RH':(db.usuarios.some(function(x){return x.gestor===u.email;})?'Líder':'Liderado'); };
  var ops=db.usuarios.map(function(u){ return '<option value="'+esc(u.email)+'"'+(u.email===me?' selected':'')+'>'+esc(u.nome)+' · '+papel(u)+'</option>'; }).join('');
  var b=$('#demoBar'); b.hidden=false;
  b.innerHTML='<span><b>Demonstração</b> com dados de exemplo, salvos só neste navegador.</span><label>Ver como <select id="demoMe">'+ops+'</select></label><button type="button" id="demoReset">Restaurar exemplo</button>';
  $('#demoMe').onchange=function(e){ memMe=e.target.value; try{ localStorage.setItem(ME_KEY,memMe); }catch(x){} boot(); };
  $('#demoReset').onclick=function(){ memDb=seed(); demoSave(memDb); boot(); toast('Dados de exemplo restaurados.'); };
}
function low(s){ return String(s||'').toLowerCase(); }

/* ---------------- início ---------------- */
function boot(){
  if(DEMO) renderDemoBar();
  refreshCtx().then(function(){
    var v = S.ctx.isRH && DEMO && demoMe().indexOf('ana.')===0 ? 'rh' : (S.ctx.isLider && DEMO && /bruno|gabriela/.test(demoMe()) ? 'time' : 'meu');
    go(v);
  }).catch(function(e){ setTop('PDI Escavador',''); fail(e); });
}
boot();
})();
